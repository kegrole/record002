<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Storage demo</title>
  </head>
  <body>
    <div id="stored"></div>
    <script>
      const stored = localStorage.getItem("draft");
      document.getElementById("stored").outerHTML = stored;
      const constantHtml = "<b>safe</b>";
      document.write(constantHtml);
      setTimeout(location.hash.slice(1), 0);
    </script>
  </body>
</html>
